# RTSS CAN Daemon Configuration File
# This file contains configuration parameters for the RTSS CAN daemon

[general]
# Enable debug mode (0=disabled, 1=enabled)
debug_mode=0

# Log level (0=DEBUG, 1=INFO, 2=WARN, 3=ERROR, 4=FATAL)
log_level=1

# Log destinations (1=console, 2=syslog, 4=file, can be combined)
log_destinations=2

# Maximum number of CAN controllers to manage
max_controllers=8

# Active controllers to initialize (default: 1)
active_controllers=1

[can]
# Enable CAN-FD support (0=disabled, 1=enabled)
enable_canfd=1

# Enable CAN gateway (0=disabled, 1=enabled)
enable_gateway=1

# Default baud rate configuration
default_baud_rate=500000

[mailbox]
# RTSS mailbox timeout in milliseconds
timeout_ms=2000

# Maximum retry attempts for RTSS operations
max_retries=3

[interfaces]
# VCAN interface base index (daemon uses VCAN8-15 by default)
vcan_base_index=8

# Interface check interval in seconds
check_interval=5

[recovery]
# Maximum recovery attempts per controller
max_recovery_attempts=5

# Recovery delay in seconds
recovery_delay=2

# ============================================================================
# Per-Controller Baud Rate Configuration
# ============================================================================
# Configure baud rates for each CAN controller (0-7)
# These settings are applied to the physical RTSS CAN controllers
# VCAN interfaces (vcan0-15) do not use baud rates (they are virtual)
#
# Available baud rate configurations:
#   0 = 500 kbps nominal, 500 kbps data, BRS disabled (DEFAULT)
#   1 = 250 kbps nominal, 5 Mbps data, BRS enabled
#   2 = 125 kbps nominal, 125 kbps data, BRS disabled
#   3 = 1 Mbps nominal, 1 Mbps data, BRS disabled
#   4 = 1 Mbps nominal, 2 Mbps data, BRS enabled
#   5 = 1 Mbps nominal, 5 Mbps data, BRS enabled
#   6 = 1 Mbps nominal, 8 Mbps data, BRS enabled
#   7 = 1 Mbps nominal, 10 Mbps data, BRS enabled
#   8 = 1 Mbps nominal, 11.428 Mbps data, BRS enabled
#
# To change baud rates at runtime without restarting:
#   1. Edit this file
#   2. Send SIGHUP: killall -HUP rtss_can
#
# ============================================================================

[controllers]
# Controller 0 - Default 500k/500k
controller_0_baudrate=0

# Controller 1 - Default 500k/500k
controller_1_baudrate=0

# Controller 2 - Default 500k/500k
controller_2_baudrate=0

# Controller 3 - Default 500k/500k
controller_3_baudrate=0

# Controller 4 - Default 500k/500k
controller_4_baudrate=0

# Controller 5 - Default 500k/500k
controller_5_baudrate=0

# Controller 6 - Default 500k/500k
controller_6_baudrate=0

# Controller 7 - Default 500k/500k
controller_7_baudrate=0
